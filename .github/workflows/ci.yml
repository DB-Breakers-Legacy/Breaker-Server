name: managed-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore BreakerServer/ProtocolTests/ProtocolTests.csproj
      - run: dotnet build BreakerServer/BreakerServer/BreakerServer.csproj --configuration Release --no-restore
      - run: dotnet test BreakerServer/ProtocolTests/ProtocolTests.csproj --configuration Release --no-restore
