[project]
name = "breaker-server"
version = "0.1.0"
description = "Community server-preservation reimplementation for DRAGON BALL: THE BREAKERS"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "breaker_server.settings"
addopts = "-m 'not golden and not integration'"
markers = [
    "golden: tests that need the private golden transcripts (DIARKIS_TRANSCRIPTS_DIR)",
    "integration: end-to-end tests against live components (Phase 5, not yet implemented)",
]
